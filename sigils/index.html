<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="../manifest.json">
    <title>sigils</title>
    <style>
        @font-face {
            font-family: 'IBMPlexMono';
            src: url('../IBMPlexMono-Regular.ttf');
        }
        :root { --dim: rgba(255, 255, 255, 0.45); }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'IBMPlexMono', monospace;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
        }
        a { color: var(--dim); text-decoration: none; }
        a:hover, a:focus-visible { color: #fff; }
        #back { position: fixed; top: 14px; left: 16px; font-size: 16px; }
        figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; }
        canvas { display: block; }
        figcaption { color: var(--dim); display: flex; gap: 18px; min-height: 1.4em; }
    </style>
</head>
<body>
    <a id="back" href="../" aria-label="back to the index">←</a>
    <figure>
        <canvas id="plate" role="img" aria-label="a seal in the manner of the Goetia, in a double ring with its name"></canvas>
        <figcaption id="cap">drawing…</figcaption>
    </figure>

    <script src="sigil-data.js"></script>
    <script src="generator.js"></script>
    <script src="plate.js"></script>
    <script>
        // one seal per visit; a number in the URL (#1234) shows that seal again
        const fromHash = parseInt(location.hash.slice(1), 10);
        const seed = fromHash >= 0 ? fromHash : Math.floor(Math.random() * 1e9);
        const cap = document.getElementById('cap'), canvas = document.getElementById('plate');

        // drawn at the screen's own pixel density, so nothing is scaled up
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        const cssSize = Math.max(240, Math.min(window.innerWidth - 32, window.innerHeight * 0.82 - 40, 720));
        const R = Math.round(cssSize * dpr / 2.14);

        setTimeout(() => {
            const enc = Sigils.sealForSeed(seed), name = Sigils.nameForSeed(seed);
            const img = Sigils.renderPlate(enc, name, seed, { R });
            canvas.width = img.width; canvas.height = img.height;
            canvas.style.width = canvas.style.height = (img.width / dpr) + 'px';
            canvas.getContext('2d').putImageData(new ImageData(img.data, img.width, img.height), 0, 0);
            canvas.setAttribute('aria-label', `the seal of ${name}, in the manner of the Goetia`);
            cap.innerHTML = '';
            const link = (text, href, title) => {
                const a = document.createElement('a');
                a.textContent = text; a.href = href; if (title) a.title = title;
                cap.appendChild(a); return a;
            };
            link(`No. ${seed}`, `#${seed}`, 'this seal again');
            link('another', './', 'a new seal').onclick = e => { e.preventDefault(); location.href = location.pathname; };
            link('png', '#', 'download').onclick = e => {
                e.preventDefault();
                canvas.toBlob(b => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(b); a.download = `sigil-${seed}-${name.toLowerCase()}.png`; a.click();
                    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
                });
            };
        }, 30);

        // following the permalink from this page should redraw that seal
        window.addEventListener('hashchange', () => location.reload());
    </script>
</body>
</html>
