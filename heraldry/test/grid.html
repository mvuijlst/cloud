<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>grid</title>
<style>body{margin:4px;font:10px monospace}.g{display:flex;flex-wrap:wrap;gap:4px}svg{width:380px;height:380px;border:1px solid #ccc}</style></head><body><div class="g" id="g"></div>
<script src="../geometry.js"></script><script src="../charges.js"></script><script src="../charges-art.js"></script>
<script>
const Q = new URLSearchParams(location.search); const names = (Q.get('n') || 'lion rampant').split(','); const VB = Q.get('vb') || '-0.02 -0.02 1.04 1.04'; const STEP = +(Q.get('step') || 0.1);
for (const n of names) {
  const a = Heraldry.ART[n]; let s = `<svg viewBox="${VB}" xmlns="http://www.w3.org/2000/svg">`;
  for (const L of a.layers) s += `<path d="${Heraldry.P.toD(L.d, 4)}" fill="${L.role === 'body' ? '#f2c230' : L.role === 'white' ? '#fff' : '#000'}"/>`;
  for (let v = 0; v <= 1.0001; v += STEP) { const k = v.toFixed(2); s += `<line x1="${k}" y1="-1" x2="${k}" y2="2" stroke="#e00" stroke-width="0.001"/><line y1="${k}" x1="-1" y2="${k}" x2="2" stroke="#e00" stroke-width="0.001"/><text x="${k}" y="${VB.split(' ')[1]*1+0.01}" font-size="0.008" fill="#e00">${k}</text><text y="${k}" x="${VB.split(' ')[0]*1}" font-size="0.008" fill="#e00">${k}</text>`; }
  s += '</svg>';
  const d = document.createElement('div'); d.innerHTML = s + '<div>' + n + ' ' + a.w + 'x' + a.h + '</div>'; document.getElementById('g').appendChild(d);
}
</script></body></html>
